name: Verify coastal architecture and interface
on:
  push:
    branches: [graphics/visual-overhaul]
    paths: ['.coastal-update/edits.json']
permissions:
  contents: write
concurrency:
  group: coastal-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'rebixpl/slop_theft_6' && github.ref == 'refs/heads/graphics/visual-overhaul'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source edits with before and after checksums
        shell: python
        run: |
          import hashlib, json, pathlib
          allowed = {'game.js', 'graphics/shaders.js', 'index.html', 'package.json', 'tests/browser-smoke.cjs'}
          edits = json.loads(pathlib.Path('.coastal-update/edits.json').read_text())
          assert {item['path'] for item in edits} == allowed
          outputs = []
          for item in edits:
              destination = pathlib.Path(item['path'])
              current = destination.read_bytes()
              assert hashlib.sha256(current).hexdigest() == item['before'], 'Source changed: ' + item['path']
              lines = current.decode().splitlines(True)
              for begin, end, replacement in reversed(item['edits']):
                  assert 0 <= begin <= end <= len(lines)
                  lines[begin:end] = [replacement]
              updated = ''.join(lines).encode()
              assert hashlib.sha256(updated).hexdigest() == item['after'], 'Result checksum mismatch: ' + item['path']
              outputs.append((destination, updated))
          for destination, updated in outputs:
              destination.write_bytes(updated)
          print('Applied and verified', len(outputs), 'source files.')
      - name: Syntax and unit tests
        shell: bash
        run: |
          node --check game.js
          node --check asset-loader.js
          node --check graphics/shaders.js
          node --check graphics/architecture.js
          node --check ui/interface.js
          npm test 2>&1 | tee /tmp/unit-tests.txt
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Actual WebGL and responsive interface tests
        shell: bash
        run: node --test tests/renderer.test.cjs tests/interface.test.cjs 2>&1 | tee /tmp/browser-tests.txt
      - name: HTTP game and interactive atlas checks
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/server.log 2>&1 &
          QA_OUTPUT=/tmp/coastal-qa/normal node tests/browser-smoke.cjs 2>&1 | tee /tmp/game-normal.txt
          QA_NO_VAO=1 QA_DAY_ONLY=1 QA_OUTPUT=/tmp/coastal-qa/fallback node tests/browser-smoke.cjs 2>&1 | tee /tmp/game-fallback.txt
      - name: Commit verified changes to graphics branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/graphics/visual-overhaul'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js graphics/shaders.js index.html package.json tests/browser-smoke.cjs
          git commit -m 'Upgrade coastal architecture, textured materials and interactive game UI'
          git push origin HEAD:refs/heads/graphics/visual-overhaul
          git rev-parse HEAD > /tmp/tested-commit.txt
      - name: Preserve source for reproducibility
        if: always()
        run: git archive --format=zip HEAD -o /tmp/coastal-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastal-architecture-ui-evidence
          path: |
            /tmp/coastal-qa
            /tmp/unit-tests.txt
            /tmp/browser-tests.txt
            /tmp/game-normal.txt
            /tmp/game-fallback.txt
            /tmp/server.log
            /tmp/tested-commit.txt
            /tmp/coastal-source.zip
          retention-days: 5
          if-no-files-found: error
